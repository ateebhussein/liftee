name = "liftee"
compatibility_date = "2024-11-01"
pages_build_output_dir = "."

# --- Non-secret vars — fill in after creating your Supabase/Google Cloud
# projects (see README.md). These are read by functions/api/google/*.js. ---
[vars]
GOOGLE_CLIENT_ID = "PASTE_YOUR_GOOGLE_OAUTH_CLIENT_ID"
SUPABASE_URL = "https://PASTE_YOUR_PROJECT_REF.supabase.co"
SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY"
# Your Cloudflare Pages production URL, no trailing slash. Used server-side
# to build Google's redirect_uri and the post-auth redirect back to the app.
PUBLIC_SITE_URL = "https://PASTE_YOUR_PROJECT.pages.dev"

# --- Secrets — do NOT put these here. Set them with:
#   wrangler pages secret put GOOGLE_CLIENT_SECRET
#   wrangler pages secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler pages secret put STATE_SIGNING_SECRET   (any long random string you generate)
